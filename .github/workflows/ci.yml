name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev poppler-utils

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci -j

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend
