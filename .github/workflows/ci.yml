name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci -j

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
